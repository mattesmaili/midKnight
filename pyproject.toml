[project]
name = "midknight"
version = "0.1.0"
description = "MidKnight: a 5x6 chess variant you can play in the browser"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
neural = ["tensorflow"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests; run with pytest -m slow"]
addopts = "-m 'not slow'"
